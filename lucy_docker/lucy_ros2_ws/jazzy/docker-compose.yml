services:
  lucy_ros2_ws:
    container_name: "lucy_ros2_ws_jazzy"
    image: ghcr.io/sentience-robotics/lucy_ros2_ws:jazzy
    restart: unless-stopped
    command: tail -f /dev/null
    volumes:
      - "${LUCY}:/home/rosdev/lucy_ros2_ws"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
    network_mode: host
